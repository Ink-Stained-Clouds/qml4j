name: Publish to Maven Central

# Publishes qml4j-core to Maven Central (Central Portal) when a GitHub Release is
# published. The release tag drives the version (tag `v0.1.2` or `0.1.2` -> 0.1.2),
# so you don't have to bump the POM by hand before releasing.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions -> New):
#   CENTRAL_USERNAME - Central Portal user token username (Account -> Generate User Token)
#   CENTRAL_PASSWORD - Central Portal user token password
#   GPG_PRIVATE_KEY  - armored secret key:  gpg --armor --export-secret-keys 0EE13CEB54354D14
#   GPG_PASSPHRASE   - that key's passphrase

on:
  release:
    types: [published]
  workflow_dispatch: {}   # also allow a manual run from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK, Maven settings (server id=central) and GPG
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from the release tag
        if: github.event_name == 'release'
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build, sign and deploy
        run: mvn -B --no-transfer-progress -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
