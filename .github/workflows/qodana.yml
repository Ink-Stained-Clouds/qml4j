name: Qodana Code Inspection

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to push results to the GitHub Security panel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Qodana uses git history for baseline / PR-scoped analysis

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --report-dir,${{ runner.temp }}/qodana/results,--baseline,qodana.sarif.json

      # Publish the raw SARIF so it can be downloaded and committed as the baseline
      # (qodana.sarif.json at repo root). Once the baseline is in place, future runs
      # only flag NEW problems. always() so it's available even if a quality gate fails.
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json

      - name: Upload SARIF report to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
