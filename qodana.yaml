# Qodana Community (JVM) — runs the IntelliJ inspection engine in CI.
# Unlike PMD/Checkstyle it is hierarchy/contract aware, so it does NOT
# false-positive on uniform-signature dispatch (e.g. a private method bound via
# this::m to a functional interface) or polymorphic hooks (Item.paint) — which is
# why parameter-level "unused" analysis is delegated here, not to the maven gate.
version: "1.0"
linter: jetbrains/qodana-jvm-community:latest
# Default is qodana.starter (a focused subset, no unused-declaration checks).
# qodana.recommended adds the full IDE inspection set -- unused declarations and
# parameters included, with the hierarchy/contract awareness PMD/ECJ lack.
profile:
  name: qodana.recommended

# The recommended profile omits the global "Unused declaration" inspection (it
# needs whole-project analysis). Enable it explicitly -- this is the IDE-grade,
# hierarchy/entry-point-aware unused analysis (unused classes/methods/fields and
# parameters) that PMD/ECJ can't do without false-positiving on the dispatch and
# polymorphic-hook design.
include:
  - name: unused

# Quality gate: fail the scan on NEW high/critical problems. Existing findings are
# captured in the baseline (qodana.sarif.json, passed via --baseline in the
# workflow), so only regressions a change introduces trip the gate; moderate/low
# go to the Code scanning dashboard only. Pair with a branch-protection rule
# requiring this check to actually block merges.
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
